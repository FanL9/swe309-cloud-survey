{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="survey-card card mx-auto text-center">
  <div class="card-body p-4 p-md-5">
    <p class="display-6 fw-bold mb-2" style="color: var(--brand)">{{ code }}</p>
    <p class="text-secondary mb-4">{{ message }}</p>
    {% if current_staff() %}
    <a class="btn btn-light mb-0" href="{{ url_for('staff.responses') }}">Back to responses</a>
    {% else %}
    <a class="btn btn-light mb-0" href="{{ url_for('survey.survey_form') }}">Back to the survey</a>
    {% endif %}
  </div>
</div>
{% endblock %}
