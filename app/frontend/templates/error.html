{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="survey-card card shadow-sm mx-auto text-center">
  <div class="card-body p-4 p-md-5">
    <h1 class="h3 mb-3">{{ code }}</h1>
    <p class="text-body-secondary mb-4">{{ message }}</p>
    <a class="btn btn-outline-secondary" href="{{ url_for('survey.survey_form') }}">Back to the survey</a>
  </div>
</div>
{% endblock %}
