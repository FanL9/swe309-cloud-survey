<!doctype html>
<html lang="en">
<head>
  {% include "partials/head.html" %}
  <title>{% block title %}Customer Survey{% endblock %} · Company A</title>
</head>
<body>
  <div class="public-shell">
    <header class="public-top">
      <div class="container d-flex align-items-center justify-content-between py-3">
        <a class="d-flex align-items-center text-decoration-none" href="{{ url_for('survey.survey_form') }}">
          <span class="brand-mark me-2">A</span>
          <span class="fw-bold" style="color: var(--ink)">Company A</span>
        </a>
        <span class="small text-secondary d-none d-sm-inline">Customer satisfaction survey</span>
      </div>
    </header>
    <main class="container flex-grow-1 py-5">
      {% block content %}{% endblock %}
    </main>
    <footer class="container pb-4 small text-secondary text-center">
      Fictional company for SWE309 coursework. Synthetic data only.
    </footer>
  </div>
</body>
</html>
