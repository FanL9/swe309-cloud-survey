<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Customer Survey{% endblock %} · Company A</title>
  {# All third-party styling is loaded here, so swapping templates later only touches this file and app.css. #}
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar border-bottom bg-body">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('survey.survey_form') }}">Company A</a>
      <span class="navbar-text small text-body-secondary">Customer satisfaction survey</span>
    </div>
  </nav>
  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>
  <footer class="container pb-4 small text-body-secondary text-center">
    Fictional company for SWE309 coursework. Synthetic data only.
  </footer>
</body>
</html>
