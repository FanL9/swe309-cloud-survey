{% macro rating_badge(rating) -%}
<span class="badge badge-rating badge-{{ rating | lower }}">{{ rating }}</span>
{%- endmacro %}

{# Simple line icons (24x24, stroke = currentColor). #}
{% macro icon(name, cls="nav-icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "list" -%}
<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>
{%- elif name == "download" -%}
<path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/>
{%- elif name == "logout" -%}
<path d="M15 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4M10 17l5-5-5-5M15 12H3"/>
{%- elif name == "search" -%}
<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
{%- elif name == "external" -%}
<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>
{%- elif name == "menu" -%}
<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == "back" -%}
<path d="M15 18l-6-6 6-6"/>
{%- endif -%}
</svg>
{%- endmacro %}
